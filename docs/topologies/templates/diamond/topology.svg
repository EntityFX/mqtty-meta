<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img">
<title>Ромб: два пути</title>
<rect width="1000" height="640" fill="white"/>
<text x="500" y="35" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333333">Ромб: два пути</text>
<line data-from="B0" data-to="B1" x1="150" y1="320" x2="500" y2="140" stroke="#4D4D4D" stroke-width="2"/>
<line data-from="B0" data-to="B2" x1="150" y1="320" x2="500" y2="500" stroke="#4D4D4D" stroke-width="2"/>
<line data-from="B1" data-to="B3" x1="500" y1="140" x2="850" y2="320" stroke="#4D4D4D" stroke-width="2"/>
<line data-from="B2" data-to="B3" x1="500" y1="500" x2="850" y2="320" stroke="#4D4D4D" stroke-width="2"/>
<g data-node-id="B0"><circle cx="150" cy="320" r="23" fill="#0072B2"/><text x="150" y="368" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 0</text></g>
<g data-node-id="B1"><circle cx="500" cy="140" r="23" fill="#0072B2"/><text x="500" y="188" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 1</text></g>
<g data-node-id="B2"><circle cx="500" cy="500" r="23" fill="#0072B2"/><text x="500" y="548" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 2</text></g>
<g data-node-id="B3"><circle cx="850" cy="320" r="23" fill="#0072B2"/><text x="850" y="368" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 3</text></g>
<text x="500" y="610" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333333">Связи двусторонние; MQTT-маршруты отдельно не заданы. Учебный шаблон.</text></svg>
