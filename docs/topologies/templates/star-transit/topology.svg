<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img">
<title>Звезда с отдельным транзитом</title>
<rect width="1000" height="640" fill="white"/>
<text x="500" y="35" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333333">Звезда с отдельным транзитом</text>
<line data-from="T0" data-to="B1" x1="500" y1="320" x2="500" y2="120" stroke="#4D4D4D" stroke-width="2"/>
<line data-from="T0" data-to="B2" x1="500" y1="320" x2="800" y2="320" stroke="#4D4D4D" stroke-width="2"/>
<line data-from="T0" data-to="B3" x1="500" y1="320" x2="500" y2="520" stroke="#4D4D4D" stroke-width="2"/>
<line data-from="T0" data-to="B4" x1="500" y1="320" x2="200" y2="320" stroke="#4D4D4D" stroke-width="2"/>
<g data-node-id="T0"><circle cx="500" cy="320" r="23" fill="#767676"/><text x="500" y="368" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Транзит</text></g>
<g data-node-id="B1"><circle cx="500" cy="120" r="23" fill="#0072B2"/><text x="500" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 1</text></g>
<g data-node-id="B2"><circle cx="800" cy="320" r="23" fill="#0072B2"/><text x="800" y="368" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 2</text></g>
<g data-node-id="B3"><circle cx="500" cy="520" r="23" fill="#0072B2"/><text x="500" y="568" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 3</text></g>
<g data-node-id="B4"><circle cx="200" cy="320" r="23" fill="#0072B2"/><text x="200" y="368" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333333">Брокер 4</text></g>
<text x="500" y="610" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333333">Связи двусторонние; MQTT-маршруты отдельно не заданы. Учебный шаблон.</text></svg>
