ты → B0</text><text x="450" y="640" text-anchor="middle" font-family="sans-serif" font-size="14">P — publishers; S — subscribers. Расположение клиентов неизменно.</text><text x="450" y="666" text-anchor="middle" font-family="sans-serif" font-size="13">Связи двусторонние; логические MQTT-пути могут проходить через несколько площадок.</text></svg>